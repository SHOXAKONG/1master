name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.0). For manual runs only."
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/1master-tunnel-server

permissions:
  contents: write   # create GitHub Release + upload assets
  packages: write   # push tunnel-server image to GHCR

jobs:
  binaries:
    name: Cross-compile binaries
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Build all targets
        run: make release VERSION=${{ steps.version.outputs.version }}

      - name: Show artifacts
        run: ls -la dist/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 1master ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/1master-linux-amd64
            dist/1master-linux-arm64
            dist/1master-darwin-amd64
            dist/1master-darwin-arm64
            dist/1master-server-linux-amd64
            dist/1master-server-linux-arm64
            dist/1master-server-darwin-amd64
            dist/1master-server-darwin-arm64
            dist/SHA256SUMS
            install.sh

  image:
    name: Build & push tunnel-server image
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase image name
        id: img
        run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${{ needs.binaries.outputs.version }}
          cache-from: type=gha,scope=tunnel-server
          cache-to: type=gha,mode=max,scope=tunnel-server

